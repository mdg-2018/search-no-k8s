syncSource:
   replicaSet:
      hostAndPort: 
        - "localhost:27007"
        - "localhost:27008"
        - "localhost:27009"
      scramAuth:
         username: mongotUser
         authSource: admin
         passwordFile: "./data/mongot_passwordfile"
         tls:
            enabled: false
   router:
     hostAndPort:
       - "localhost:27020"
     scramAuth:
        username: mongotUser
        authSource: admin
        passwordFile: "./data/mongot_passwordfile"
        tls:
           enabled: false
