global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    default-server init-addr last,libc,none

frontend grpc_front
    bind *:27030 proto h2
    default_backend grpc_back

backend grpc_back
    balance roundrobin
    default-server proto h2 check
    server target1 localhost:27028
    server target2 localhost:27029
